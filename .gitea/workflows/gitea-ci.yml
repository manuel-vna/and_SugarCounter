name: Android Unit Tests

on:
  push:
  pull_request:

jobs:
  Sugar Counter:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_TOOLS: "15859902"
      ANDROID_COMPILE_SDK: "37"
      ANDROID_BUILD_TOOLS: "37.0.0"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history and tags, needed for git describe in build.gradle
          # fetch-depth controls how many commits of history the checkout step downloads.
          # The default is 1: only the last commit is downloaded
          # The value 0 means no limit: All commits, branches and tags are downloaded

      # Computed once so every later step (debug and release) can use it
      - name: Set short SHA
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        run: |
          #Using 'android-actions/setup-android@v3' caused problems so a custom script was created
          
          # Setup path for android-sdk related files
          export ANDROID_HOME="${{ github.workspace }}/android-sdk-root"
          # Create a directory for that created path
          install -d $ANDROID_HOME
          # Installing android sdk tools
          wget --no-verbose --output-document=$ANDROID_HOME/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-${ANDROID_SDK_TOOLS}_latest.zip
          unzip -q -d "$ANDROID_HOME/cmdline-tools-temp" "$ANDROID_HOME/cmdline-tools.zip"
          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
          mv "$ANDROID_HOME/cmdline-tools-temp/cmdline-tools"/* "$ANDROID_HOME/cmdline-tools/latest/"
          rm -rf "$ANDROID_HOME/cmdline-tools-temp"
          # Appending the Android CLI binary directory to the runner's global PATH ($GITHUB_PATH=envrivonment variable provided by Github Actions)
          # That is how subsequent steps can run e. g. sdkmanager or android without specifying their absolute folder paths
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          # Appending Android platform tools (like adb, fastboot) to the runner's global PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          # Exporting ANDROID_HOME as a persistent environment variable for all subsequent steps in the job
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          # Also update PATH in the current script session so we can use them immediately below
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          yes | sdkmanager --licenses --channel=3 > /dev/null || true
          android sdk install --canary "platforms;android-${ANDROID_COMPILE_SDK}" "platform-tools" "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Detekt
        run: ./gradlew detekt --no-daemon

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Assemble Debug
        if: ${{ contains(github.ref_name, 'feature') }}
        run: |
          ./gradlew assembleDebug
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/sugarCounter-${SHORT_SHA}-debug.apk

      - name: Upload Debug Artifact
        if: ${{ contains(github.ref_name, 'feature') }}
        # At the moment self-hosted Gitea runners do not support the v4 protocol
        uses: actions/upload-artifact@v3
        with:
          name: sugarCounter-${{ env.SHORT_SHA }}-debug
          path: app/build/outputs/

      - name: Store Secure Files
        if: ${{ contains(github.ref_name, 'release') }}
        env:
          FASTLANE_JSON_KEY: "${{ secrets.FASTLANE_JSON_KEY }}"
          KEYSTORE_FILE_B64: "${{ secrets.KEYSTORE_FILE_B64 }}"
        run: |
          mkdir -p .secrets
          printf '%s' "$FASTLANE_JSON_KEY" > .secrets/fastlane_json_key.json
          printf '%s' "$KEYSTORE_FILE_B64" | tr -d '[:space:]' | base64 --decode > .secrets/keystore-file
          chmod 600 .secrets/fastlane_json_key.json .secrets/keystore-file

      - name: Verify version tag
        if: ${{ contains(github.ref_name, 'release') }}
        run: |
          git describe --tags --long --always
          git describe --tags --long --always | grep -Eq '^v.*_[0-9]+-' || { echo "No tag like v1.2.3_58 found on this commit"; exit 1; }

      - name: Assemble Release
        if: ${{ contains(github.ref_name, 'release') }}
        env:
          KEY_ALIAS: "${{ secrets.KEY_ALIAS }}"
          KEY_PASSWORD: "${{ secrets.KEY_PASSWORD }}"
          KEYSTORE_FILE: "${{ github.workspace }}/.secrets/keystore-file"
          KEYSTORE_PASSWORD: "${{ secrets.KEYSTORE_PASSWORD }}"
        run: ./gradlew assembleRelease bundleRelease

      # Must run before "Rename Release Outputs": the Fastfile expects app-release.aab
      - name: Install Fastlane & Run
        env:
          FASTLANE_JSON_KEY: "${{ github.workspace }}/.secrets/fastlane_json_key.json"
        if: ${{ contains(github.ref_name, 'release') }}
        run: |
          apt-get --quiet update --yes && apt-get --quiet install --yes ruby-full build-essential libssl-dev zlib1g-dev
          gem install fastlane --no-document
          fastlane internal

      - name: Rename Release Outputs
        if: ${{ contains(github.ref_name, 'release') }}
        run: |
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/sugarCounter-${SHORT_SHA}-release.apk
          mv app/build/outputs/bundle/release/app-release.aab app/build/outputs/bundle/release/sugarCounter-${SHORT_SHA}-release.aab

      - name: Upload Release Artifact
        if: ${{ contains(github.ref_name, 'release') }}
        uses: actions/upload-artifact@v3
        with:
          name: sugarCounter-${{ env.SHORT_SHA }}-release
          path: app/build/outputs/

      # Don't leave the keystore and service account key on the runner
      - name: Remove secure files
        if: ${{ always() && contains(github.ref_name, 'release') }}
        run: rm -rf .secrets