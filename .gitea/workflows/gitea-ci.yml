name: Android Unit Tests

on:
  push:
  pull_request:

jobs:
  Sugar Counter:
    runs-on: ubuntu-latest
    env:
      ACTIONS_STEP_DEBUG: true
      ANDROID_SDK_TOOLS: "15859902"
      ANDROID_COMPILE_SDK: "37"
      ANDROID_BUILD_TOOLS: "37.0.0"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        run: |
          #Using 'android-actions/setup-android@v3' caused problems so a custom script was created
          
          # Setup path for android-sdk related files
          export ANDROID_HOME="${{ github.workspace }}/android-sdk-root"
          # Create a directory for that created path
          install -d $ANDROID_HOME
          # Installing android sdk tools
          wget --no-verbose --output-document=$ANDROID_HOME/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-${ANDROID_SDK_TOOLS}_latest.zip
          unzip -q -d "$ANDROID_HOME/cmdline-tools-temp" "$ANDROID_HOME/cmdline-tools.zip"
          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
          mv "$ANDROID_HOME/cmdline-tools-temp/cmdline-tools"/* "$ANDROID_HOME/cmdline-tools/latest/"
          rm -rf "$ANDROID_HOME/cmdline-tools-temp"
          # Appending the Android CLI binary directory to the runner's global PATH ($GITHUB_PATH=envrivonment variable provided by Github Actions)
          # That is how subsequent steps can run e. g. sdkmanager or android without specifying their absolute folder paths
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          # Appending Android platform tools (like adb, fastboot) to the runner's global PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          # Exporting ANDROID_HOME as a persistent environment variable for all subsequent steps in the job
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          # Also update PATH in the current script session so we can use them immediately below
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          yes | sdkmanager --licenses --channel=3 > /dev/null || true
          android sdk install --canary "platforms;android-${ANDROID_COMPILE_SDK}" "platform-tools" "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Detekt
        run: ./gradlew detekt --no-daemon

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Assemble Debug
        if: ${{ !contains(github.ref_name, 'release') }}
        run: |
          ./gradlew assembleDebug
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/sugarCounter-${{ env.SHORT_SHA }}-debug.apk

      - name: Upload Debug Artifact
        if: ${{ !contains(github.ref_name, 'release') }}
        # At the moment self-hosted Gitea runners do not support the v4 protocol
        uses: actions/upload-artifact@v3
        with:
          name: sugarCounter-${{ env.SHORT_SHA }}-debug
          path: app/build/outputs/

      - name: Store Secure Files
        if: ${{ contains(github.ref_name, 'release') || github.ref_name == 'master' }}
        env:
          ANDROID_KEYSTORE_BASE64: "${{ secrets.ANDROID_KEYSTORE_BASE64 }}"
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: "${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}"
          SUGAR_COUNTER_KEY_ALIAS: "${{ secrets.SUGAR_COUNTER_KEY_ALIAS }}"
          SUGAR_COUNTER_KEY: "${{ secrets.SUGAR_COUNTER_KEY }}"
          RELEASE_PLAY_CONSOLE_MVA_KEYSTORE: "${{ secrets.RELEASE_PLAY_CONSOLE_MVA_KEYSTORE }}"
        run: |
          mkdir -p .secrets
          printf '%s' "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" > .secrets/play-service-account.json
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > .secrets/release-keystore
          chmod 600 .secrets/play-service-account.json
          chmod 600 .secrets/release-keystore

          # Persist environment variables for subsequent steps (Assemble Release & Fastlane)
          echo "SUGAR_COUNTER_KEY_FILE=${{ github.workspace }}/.secrets/release-keystore" >> $GITHUB_ENV
          echo "SUGAR_COUNTER_KEY_ALIAS=$SUGAR_COUNTER_KEY_ALIAS" >> $GITHUB_ENV
          echo "SUGAR_COUNTER_KEY=$SUGAR_COUNTER_KEY" >> $GITHUB_ENV
          echo "RELEASE_PLAY_CONSOLE_MVA_KEYSTORE=$RELEASE_PLAY_CONSOLE_MVA_KEYSTORE" >> $GITHUB_ENV
          echo "GOOGLE_PLAY_SERVICE_ACCOUNT_JSON=$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" >> $GITHUB_ENV

      - name: Assemble Release
        if: ${{ contains(github.ref_name, 'release') || github.ref_name == 'master' }}
        env:
          SUGAR_COUNTER_KEY_FILE: "${{ github.workspace }}/.secrets/release-keystore"
          SUGAR_COUNTER_KEY_ALIAS: "${{ secrets.SUGAR_COUNTER_KEY_ALIAS }}"
          SUGAR_COUNTER_KEY: "${{ secrets.SUGAR_COUNTER_KEY }}"
          RELEASE_PLAY_CONSOLE_MVA_KEYSTORE: "${{ secrets.RELEASE_PLAY_CONSOLE_MVA_KEYSTORE }}"
        run: |
          ./gradlew assemble bundleRelease
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Install Fastlane & Run
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        if: ${{ contains(github.ref_name, 'release') || github.ref_name == 'master' }}
        run: |
          sudo apt-get --quiet update --yes && sudo apt-get --quiet install --yes ruby-full build-essential libssl-dev zlib1g-dev
          gem install fastlane --no-document
          fastlane internal

      - name: Rename Release Outputs
        if: ${{ contains(github.ref_name, 'release') || github.ref_name == 'master' }}
        run: |
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/sugarCounter-${{ env.SHORT_SHA }}-release.apk
          mv app/build/outputs/bundle/release/app-release.aab app/build/outputs/bundle/release/sugarCounter-${{ env.SHORT_SHA }}-release.aab

      - name: Upload Release Artifact
        if: ${{ contains(github.ref_name, 'release') || github.ref_name == 'master' }}
        uses: actions/upload-artifact@v3
        with:
          name: sugarCounter-${{ env.SHORT_SHA }}-release
          path: app/build/outputs/
